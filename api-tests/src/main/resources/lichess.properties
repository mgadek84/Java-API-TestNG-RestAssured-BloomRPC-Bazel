# Defaults for the Lichess API test framework.
# Every key can be overridden with a JVM system property, e.g.
#   bazel test //api-tests:lichess_api_test --jvmopt=-Dlichess.minIntervalMillis=2000
lichess.baseUrl=https://lichess.org
lichess.userAgent=lichess-qa-tests/0.1 (+https://github.com/mgadek84/Java-API-TestNG-RestAssured-BloomRPC-Bazel)

# Lichess asks API clients to send one request at a time and to wait a full
# minute after an HTTP 429. We space requests out and back off accordingly.
lichess.minIntervalMillis=1000
lichess.rateLimit.backoffSeconds=60
lichess.rateLimit.maxRetries=1

lichess.timeoutMillis=15000
# Soft SLA used by response-time assertions.
lichess.maxResponseTimeMillis=5000
