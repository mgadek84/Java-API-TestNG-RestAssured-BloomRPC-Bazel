syntax = "proto3";

package chess.v1;

option java_multiple_files = true;
option java_package = "io.github.mgadek84.chess.v1";
option java_outer_classname = "ChessServiceProto";

// ChessService is a small gRPC service owned by this repo. It exists so that
// gRPC tests (Java and BloomRPC) have a real target, because Lichess itself only
// exposes HTTP/JSON.
//
// It deliberately mixes two kinds of RPCs:
//   * ValidateFen      - pure domain logic, fully hermetic and deterministic.
//   * GetPlayerProfile - a gateway over the Lichess REST API, i.e. the same
//                        "microservice in front of an upstream system" shape
//                        you test in real platforms.
service ChessService {
  // Validates a position in Forsyth-Edwards Notation and describes it.
  // An invalid FEN is a valid request: the response has valid=false and a list
  // of errors. Only an empty FEN is rejected with INVALID_ARGUMENT.
  rpc ValidateFen(ValidateFenRequest) returns (ValidateFenResponse);

  // Returns the public profile of a Lichess player.
  // Errors: INVALID_ARGUMENT (bad username), NOT_FOUND (no such player),
  // RESOURCE_EXHAUSTED (Lichess rate limit), UNAVAILABLE (Lichess down).
  rpc GetPlayerProfile(GetPlayerProfileRequest) returns (PlayerProfile);
}

message ValidateFenRequest {
  // e.g. "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"
  string fen = 1;
}

enum Color {
  COLOR_UNSPECIFIED = 0;
  WHITE = 1;
  BLACK = 2;
}

message ValidateFenResponse {
  bool valid = 1;
  // Human-readable reasons why the FEN is invalid. Empty when valid.
  repeated string errors = 2;
  // The fields below are only set when valid = true.
  Color side_to_move = 3;
  // "KQkq", a subset of it, or "-".
  string castling_rights = 4;
  // e.g. "e3", or "-".
  string en_passant_square = 5;
  int32 halfmove_clock = 6;
  int32 fullmove_number = 7;
  int32 white_piece_count = 8;
  int32 black_piece_count = 9;
}

message GetPlayerProfileRequest {
  // Lichess username, case-insensitive, e.g. "thibault".
  string username = 1;
}

message Rating {
  // Lichess performance key, e.g. "blitz", "rapid", "puzzle".
  string perf = 1;
  int32 rating = 2;
  int32 games = 3;
  bool provisional = 4;
}

message PlayerProfile {
  string id = 1;
  string username = 2;
  string url = 3;
  int64 created_at_millis = 4;
  bool disabled = 5;
  // Rated perfs only, sorted by perf key so responses are stable and easy to
  // assert on. Score-based modes (storm, racer, streak) have no rating and are
  // left out.
  repeated Rating ratings = 6;
}
